<!DOCTYPE html>
<html lang="ru">

<head>
    <title>
        {% block title %}
            Title
        {% endblock %}
    </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="d-flex flex-column vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <!-- Логотип -->
                <a class="navbar-brand" href="{% url 'home:home' %}">
                    RuStore
                </a>

                <!-- Кнопка Hamburger Menu -->
                <button class="navbar-toggler order-3 order-md-3" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse order-4 ms-md-4" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-4">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %} active {% endif %}" aria-current="page" href="{% url 'home:home' %}">
                                Главная
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/about/' %} active {% endif %}" href="{% url 'home:about' %}">
                                О нас
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Магазин
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="{% url 'shopapp:products_list' %}">Товары</a></li>
                                <li><a class="dropdown-item" href="{% url 'shopapp:orders_list' %}">Заказы</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'blogapp:blog' %}">
                                Блог
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/contacts/' %} active {% endif %}" href="{% url 'home:contacts' %}" tabindex="-1" aria-disabled="true">
                                Контакты
                            </a>
                        </li>
                    </ul>

                    <!-- Поиск -->
                    <form class="d-flex">
                        <input class="form-control me-2" type="search" placeholder="Найти товары" aria-label="Search">
                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>
                </div>

                <div class="order-2 order-md-4 ms-md-4 d-flex">

                    <!-- Корзина -->
                    <button onclick="window.location.href = '{% url 'shopapp:orders_list' %}';" class="btn btn-outline-light position-relative">
                        <i class="bi bi-bag"></i>
                        {% if orders %}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ orders.count }}
                            </span>
                        {% endif %}
                    </button>

                    <!-- Кнопка авторизации и выхода -->
                    {% if login %}
                        <form action="{% url 'myauth:logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light ms-2">
                                Выйти
                            </button>
                        </form>
                    {% else %}
                        <button onclick="window.location.href = '/accounts/login/';" class="btn btn-outline-light ms-2">
                            Войти
                        </button>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block body %}
            <div class="container">
                <div class="row">
                    <div class="col">
                        Body
                    </div>
                </div>
            </div>
        {% endblock %}
    </main>

    <footer class="mt-auto">
        <div class="container-fluid bg-light text-center pt-3 pb-3 mt-5">
            <div class="container">
                <div class="row">
                    <div class="col">
                        © {% now 'Y' %} Лосев Кирилл
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Стили -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</body>

</html>
